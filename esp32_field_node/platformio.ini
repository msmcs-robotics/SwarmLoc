; PlatformIO project: esp32_field_node
;
; Hardware: ESP32-WROOM-32D DevKit (CP2102 USB-UART)
;           + DSD Tech 0.96" SSD1306 OLED (I2C, 0x3C, SDA=21 SCL=22)
;           + future MPU6050 IMU (I2C, same bus)
; Default port: /dev/ttyUSB0

[platformio]
default_envs = field_node

[env:field_node]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder, time

; U8g2 chosen to match the convention used by sibling projects
; (DWS1000_UWB and GPS_module use it for SSD1306 displays — see
; docs/findings/existing-demo-inventory.md).
lib_deps =
    olikraus/U8g2

build_flags =
    -D OLED_I2C_ADDR=0x3C
    -D OLED_WIDTH=128
    -D OLED_HEIGHT=64
